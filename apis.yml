name: Assist
description: >-
  Assist (assi.st) was a San Francisco conversational-commerce platform founded in 2015 by Shane Mac,
  Giovanni Vatieri, and Geek Squad founder Robert Stephens, and backed by Slow Ventures. Assist built
  branded chatbot and voice assistant experiences that let consumers order, book, and pay inside
  messaging channels, running deployments for brands including Fandango, 1-800-Flowers, and Hyatt
  across Facebook Messenger, Telegram, Twitter, Apple Business Chat, Amazon Alexa, and Google
  Assistant, where it shipped one of the first Google Actions at launch in 2016. Conversocial acquired
  Assist in March 2019 and Shane Mac became Conversocial's Chief Automation Officer. The assi.st
  domain is now parked with no web host, and Assist never published a public developer portal, API
  documentation, or machine-readable API specification, so there is no API surface to catalog.
